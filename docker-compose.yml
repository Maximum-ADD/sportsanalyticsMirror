services:
  postgres:
    image: postgres:16-alpine
    container_name: nba-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nba_analytics
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  runner:
    image: gitea/act_runner:latest
    container_name: sportsanalytics-runner
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=https://sdp.ms.wits.ac.za
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=sportsanalytics-runner
      - GITEA_RUNNER_LABELS=default:docker://gitea/runner-images:ubuntu-latest,ubuntu-latest:docker://gitea/runner-images:ubuntu-latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/data
volumes:
  postgres-data:
  runner-data:
  
