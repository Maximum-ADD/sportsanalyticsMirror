# Render Blueprint for the NBA Analytics Platform API.
# Deploys apps/api as a long-running Node.js web service on Render.
# The frontend stays on Cloudflare Pages (static hosting, free global CDN).

services:
  - type: web
    name: sportsanalytics-api
    runtime: node
    plan: free
    branch: main
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # preDeployCommand is not supported on Render's free tier, so pending
    # migrations are applied here on start instead. `prisma migrate deploy`
    # only runs migrations already committed under prisma/migrations (never
    # generates new ones) and is a no-op when the DB is up to date, so it is
    # safe to run on every boot. If it fails the service won't start — which
    # is the intended outcome, rather than serving code against a schema that
    # is missing columns it queries.
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      # Set the secret values in the Render Dashboard (sync: false keeps the
      # YAML from overwriting them). Never commit real values here.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
