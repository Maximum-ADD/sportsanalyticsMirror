app = 'sportsanalytics-api'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  # Keep the API warm — no cold starts for BetterAuth/session cookies.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[deploy]
  # Run pending Prisma migrations before the new Machines take traffic.
  release_command = 'npx prisma migrate deploy'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
