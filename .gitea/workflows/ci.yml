name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` here on purpose: it needs the act_runner cache server to
      # be reachable, and setup-node fails the step when it isn't. Once caching
      # is confirmed working on the runner, add:
      #   cache: npm
      #   cache-dependency-path: apps/api/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The shared runner occasionally stalls a registry connection with no
      # error output; npm's default per-request timeout is 5 minutes, so two
      # stalled attempts silently burn 10+ minutes before the job dies. Bound
      # each attempt to 60s so npm fails fast and retries instead of hanging.
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      # The generated Prisma client is a typecheck dependency — src/ references
      # model fields, so tsc fails without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: |
          if ls eslint.config.* 2>/dev/null; then
            npm run lint
          else
            echo "::warning title=API lint skipped::apps/api has no eslint.config.js. ESLint 10 requires a flat config, so 'npm run lint' cannot run. Add apps/api/eslint.config.js and this step starts enforcing automatically."
          fi

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

  web:
    name: Web — lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the API job for why npm caching is left off.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # See the API job for the fetch timeout/retry tuning (stalled registry
      # connections on this runner can otherwise hang a bare `npm ci` for
      # 10+ minutes with no output before the job dies).
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Lint
        run: npm run lint

      # Solution-style tsconfig (references app + node projects), so build mode.
      - name: Typecheck
        run: npx tsc -b --noEmit

  coverage:
    name: API and Web — test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The API e2e suite needs a real, disposable Postgres database.
    #
    # PGPORT moves the server off 5432 because this runner is shared with every
    # other group and runs jobs with `network: host`: on the default port the
    # service lost the race to bind and died before any step ran ("could not
    # bind IPv4 address 0.0.0.0: Address in use"). 55439 also stays clear of the
    # 55432/55433 docker-compose.yml publishes, so a runner host that has ever
    # brought our own compose file up doesn't collide either.
    #
    # The address tests connect on is resolved by the "Wait for Postgres" step
    # rather than hardcoded here — see the comment on that step.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nba_analytics_test
          PGPORT: 55439
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # DATABASE_URL is deliberately not set here: "Wait for Postgres" writes it
    # once it knows which address answers, and a job-level value would take
    # precedence over what that step puts in $GITHUB_ENV.
    env:
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # See the API job for the fetch timeout/retry tuning (stalled registry
      # connections on this runner can otherwise hang a bare `npm ci` for
      # 10+ minutes with no output before the job dies).
      - name: Install API dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/api --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Install Web dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/web --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      # Which address reaches the service container depends on how the runner
      # networks jobs, and that has already changed under us once: the
      # `postgres` bridge alias worked on our own runner, localhost was needed
      # after the switch to the shared one. act_runner also doesn't hold steps
      # back for a service's health check, so guessing wrong doesn't fail here
      # — it surfaces minutes later as a Prisma P1001 inside vitest. So probe
      # both modes, confirm what answers really is our disposable test database
      # (on a host-networked shared runner something else may hold the port),
      # and only then pin DATABASE_URL for the steps that follow.
      - name: Wait for Postgres
        shell: bash
        working-directory: apps/api
        run: |
          set -u
          candidates="localhost:55439 postgres:55439"
          tcp_open() { (exec 3<>"/dev/tcp/$1/$2") 2>/dev/null; }

          for _attempt in $(seq 1 30); do
            for candidate in $candidates; do
              host=${candidate%:*}
              port=${candidate##*:}
              tcp_open "$host" "$port" || continue
              url="postgresql://postgres:postgres@$host:$port/nba_analytics_test?schema=public"
              if echo "SELECT 1" | npx prisma db execute --url "$url" --stdin >/dev/null 2>&1; then
                echo "Postgres answered on $host:$port"
                echo "DATABASE_URL=$url" >>"$GITHUB_ENV"
                exit 0
              fi
              echo "note: $host:$port took a TCP connection but is not our test database; ignoring it"
            done
            sleep 2
          done

          echo "::error title=Postgres never became reachable::Tried $candidates for 60s. Diagnostics below."
          if command -v docker >/dev/null 2>&1; then
            docker ps -a || true
            for cid in $(docker ps -aq --filter "name=postgres" 2>/dev/null); do
              echo "--- docker logs $cid ---"
              docker logs --tail 40 "$cid" 2>&1 || true
            done
          fi
          command -v ss >/dev/null 2>&1 && ss -ltn || true
          exit 1

      - name: Run API coverage
        run: npm run test:cov --prefix apps/api

      - name: Run Web coverage
        run: npm run test:cov --prefix apps/web

      - name: Build combined coverage report
        run: npm run coverage:report

      # Gitea 1.24.7 supports the legacy artifact protocol. Its v4 backend
      # requires a patched action and is avoided until the server is upgraded.
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v3.2.2
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error
