name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: default
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    # The e2e suite (apps/api/test/**) needs a real, disposable Postgres —
    # test/global-setup.ts runs `prisma migrate deploy` against it and throws
    # immediately if DATABASE_URL isn't set. This runner executes jobs inside
    # their own container (GITEA_RUNNER_LABELS points at
    # docker://gitea/runner-images:ubuntu-latest — see docker-compose.yml),
    # so the job can't reach a service container via `localhost`, only via
    # the service's own name on its normal internal port. (First attempt at
    # this used `localhost:${{ job.services.postgres.ports['5432'] }}`, the
    # pattern for jobs running directly on a bare runner host — wrong mode
    # for this runner, confirmed by the resulting P1001 "can't reach
    # localhost:5432" failure.)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nba_analytics_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nba_analytics_test?schema=public
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` here on purpose: it needs the act_runner cache server to
      # be reachable, and setup-node fails the step when it isn't. Once caching
      # is confirmed working on the runner, add:
      #   cache: npm
      #   cache-dependency-path: apps/api/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # The generated Prisma client is a typecheck dependency — src/ references
      # model fields, so tsc fails without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: |
          if ls eslint.config.* 2>/dev/null; then
            npm run lint
          else
            echo "::warning title=API lint skipped::apps/api has no eslint.config.js. ESLint 10 requires a flat config, so 'npm run lint' cannot run. Add apps/api/eslint.config.js and this step starts enforcing automatically."
          fi

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # DATABASE_URL etc. come from the job-level `env:` above, read directly
      # from process.env — vitest.config.ts's dotenv call only fills in vars
      # that aren't already set, so it's a no-op here (no .env.test file
      # exists in a fresh CI checkout, which is fine).
      - name: Test
        run: npm test

  web:
    name: Web — lint, typecheck, test
    runs-on: default
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the API job for why npm caching is left off.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Solution-style tsconfig (references app + node projects), so build mode.
      - name: Typecheck
        run: npx tsc -b --noEmit

      # No test script defined yet; --if-present keeps this green and picks the
      # suite up automatically once one is added to apps/web/package.json.
      - name: Test
        run: npm run test --if-present
