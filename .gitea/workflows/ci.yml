name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
#
# Keyed on the PR number where there is one, because pushing to a branch with
# an open PR fires both `push` and `pull_request`, and those carry different
# refs (refs/heads/<branch> vs refs/pull/<n>/merge). Keyed on github.ref alone
# they land in different groups, never dedupe, and run the whole matrix twice
# on a runner shared with every other group on the machine.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` here on purpose: it needs the act_runner cache server to
      # be reachable, and setup-node fails the step when it isn't. Once caching
      # is confirmed working on the runner, add:
      #   cache: npm
      #   cache-dependency-path: apps/api/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The shared runner occasionally stalls a registry connection with no
      # error output; npm's default per-request timeout is 5 minutes, so two
      # stalled attempts silently burn 10+ minutes before the job dies. Bound
      # each attempt to 60s so npm fails fast and retries instead of hanging.
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      # The generated Prisma client is a typecheck dependency — src/ references
      # model fields, so tsc fails without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      # The guard this used to carry (skip lint when no flat config exists) is
      # obsolete: apps/api/eslint.config.js landed in 9294b65, so the skip
      # branch was dead and its warning was misleading about what CI enforces.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

  web:
    name: Web — lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the API job for why npm caching is left off.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # See the API job for the fetch timeout/retry tuning (stalled registry
      # connections on this runner can otherwise hang a bare `npm ci` for
      # 10+ minutes with no output before the job dies).
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Lint
        run: npm run lint

      # Solution-style tsconfig (references app + node projects), so build mode.
      - name: Typecheck
        run: npx tsc -b --noEmit

  coverage:
    name: API and Web — test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The API e2e suite needs a real, disposable Postgres database, and it is
    # started as a step below rather than with `services:`. Three attempts at
    # the services block never went green (497b2c4, 03d38ba, 566c8d1), and the
    # reason it cannot work here is now understood rather than guessed at:
    #
    # This runner runs jobs with `network: host`, shared across every group on
    # the machine. That has two consequences. There is no bridge network, so a
    # `postgres` hostname alias is silently dropped and never resolves (which
    # is what 03d38ba hit). And every `services:` port is really a host port,
    # so any fixed number we pick is a bet that no other job on the machine
    # picked it too — 5432 lost that bet, and so did 55432.
    #
    # When it loses, postgres cannot bind, prints "FATAL: could not create any
    # TCP/IP sockets" and exits about two seconds in. Docker reports an exited
    # container that has a healthcheck as `unhealthy` even though the probe
    # never ran once, so the runner fails the job with a bare "the service
    # 'postgres' is unhealthy" — no probe output, no steps, and the container
    # log buried inside the collapsed "Starting job container" group. That
    # opacity is why this went round three times.
    #
    # A bare `--health-cmd pg_isready` was also wrong independently: this
    # image's entrypoint runs initdb against a socket-only server first, and
    # pg_isready answers over that socket, so "healthy" could be reported
    # while the TCP port was still closed.

    env:
      # DATABASE_URL is deliberately not set here. The step below computes it
      # and exports it through $GITHUB_ENV, and having a second definition at
      # job level would leave a precedence question we cannot debug on a
      # runner we do not administer.
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Starts Postgres as a sibling container on Docker's default bridge with
      # NO published ports, and talks to it on its container IP. That works
      # precisely *because* the job runs with `network: host`: the job shares
      # the host's network namespace, docker0 lives in that namespace, so the
      # container's 172.17.x.x address is routable from here. Nothing is bound
      # on the host, so no other group's database can collide with ours — this
      # is structurally immune to the race a fixed port kept losing.
      #
      # Readiness is checked from both ends: a TCP connect from this side, and
      # then pg_isready against the real user and database. Both have to pass,
      # so a socket-only server still running initdb does not count as ready.
      - name: Start disposable Postgres
        run: |
          set -euo pipefail
          NAME="ci-postgres-${{ github.run_id }}"

          if ! docker info >/dev/null 2>&1; then
            echo "::error title=No Docker daemon in the job::This job starts its own Postgres and needs a reachable Docker socket. act_runner mounts one by default, so this runner is likely configured with container.docker_host: \"-\". The fallback is to install Postgres into the job instead (apt-get install postgresql, then initdb on a unix socket)."
            exit 1
          fi

          # A cancelled run is killed before its cleanup step, so sweep our own
          # leftovers. Matched by label and excluding this run, so a concurrent
          # run on another branch is left alone.
          docker ps -a --filter label=ci-postgres-for=nba-analytics --format '{{.Names}}' \
            | grep -vFx "$NAME" | xargs -r docker rm -f || true

          # Every probe below is wrapped in `timeout`. An earlier version of
          # this step used a bare `exec 3<>/dev/tcp/...`, which does not fail
          # fast: against an address that drops packets rather than refusing
          # them, each attempt blocks on the kernel's connect timeout, and the
          # step hung for nearly two hours instead of erroring in one minute.
          # `timeout-minutes` on the job did not stop it either, so nothing
          # bounds this except the commands themselves.
          probe_tcp() {
            timeout 3 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null
          }

          alive() {
            [ "$(docker inspect -f '{{.State.Running}}' "$NAME" 2>/dev/null)" = true ]
          }

          # Deliberately no --rm: if postgres dies on startup we need the
          # corpse and its log, and --rm deletes both before we can read them.
          # The "Stop disposable Postgres" step at the end does the cleanup.
          # --tmpfs rather than a volume, since the suite applies migrations
          # and truncates between specs — nothing here outlives the job.
          start_pg() {
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            docker run -d --name "$NAME" \
              --label ci-postgres-for=nba-analytics \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=nba_analytics_test \
              --tmpfs /var/lib/postgresql/data \
              "$@" postgres:16-alpine >/dev/null
          }

          # Proven from inside the container, so this says "the server is up"
          # without depending on the job being able to reach it.
          wait_server_up() {
            for _ in $(seq 1 40); do
              if ! alive; then return 1; fi
              if timeout 5 docker exec "$NAME" \
                   pg_isready -q -h 127.0.0.1 -p 5432 -U postgres -d nba_analytics_test; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          # Reachability is the part we cannot assume. The bridge address works
          # only if this job shares the host's network namespace (docker0 lives
          # there); a published port on 127.0.0.1 works in that case too, and
          # also when the daemon proxies it. Try both, each bounded, and report
          # which one won so the next person does not have to rediscover it.
          try_target() {
            for _ in $(seq 1 10); do
              if probe_tcp "$1" "$2"; then return 0; fi
              sleep 1
            done
            return 1
          }

          diagnose() {
            echo "--- container state ---"
            docker inspect -f 'running={{.State.Running}} exit={{.State.ExitCode}} err={{.State.Error}}' "$NAME" 2>&1 || true
            echo "--- postgres log (last 40) ---"
            docker logs "$NAME" 2>&1 | tail -40 || true
            echo "--- job network context ---"
            echo "hostname: $(hostname)"; ip -o addr 2>/dev/null || true
            ip route 2>/dev/null | head || true
          }

          echo "==> attempt 1: container bridge address"
          start_pg
          if ! wait_server_up; then
            echo "::error title=Postgres did not start::The server never accepted connections inside its own container, so this is not a networking problem."
            diagnose
            exit 1
          fi
          PGHOST="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$NAME")"
          echo "server is up; bridge address is '${PGHOST:-<none>}'"

          TARGET=""
          if [ -n "$PGHOST" ] && try_target "$PGHOST" 5432; then
            TARGET="$PGHOST:5432"
            echo "reachable on the bridge address"
          else
            echo "==> bridge address not reachable from this job; attempt 2: published port on 127.0.0.1"
            start_pg -p 127.0.0.1::5432
            if ! wait_server_up; then
              echo "::error title=Postgres did not start on the second attempt::"
              diagnose
              exit 1
            fi
            HOSTPORT="$(docker port "$NAME" 5432/tcp | head -1 | sed 's/.*://')"
            echo "published on 127.0.0.1:${HOSTPORT:-<none>}"
            if [ -n "$HOSTPORT" ] && try_target 127.0.0.1 "$HOSTPORT"; then
              TARGET="127.0.0.1:$HOSTPORT"
              echo "reachable on the published port"
            fi
          fi

          if [ -z "$TARGET" ]; then
            echo "::error title=Postgres is running but unreachable from the job::The server accepts connections inside its own container, but this job cannot reach it on either its bridge address or a published port. That means the job container is not sharing a network with the Docker daemon that runs it. The fallback that needs no networking at all is to install Postgres into the job and talk to it over a unix socket: apt-get install -y postgresql, run initdb as the postgres user with listen_addresses='', and set DATABASE_URL=postgresql://postgres@localhost/nba_analytics_test?host=/var/run/postgresql&schema=public"
            diagnose
            exit 1
          fi

          echo "DATABASE_URL=postgresql://postgres:postgres@${TARGET}/nba_analytics_test?schema=public" >> "$GITHUB_ENV"
          echo "using $TARGET"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # See the API job for the fetch timeout/retry tuning (stalled registry
      # connections on this runner can otherwise hang a bare `npm ci` for
      # 10+ minutes with no output before the job dies).
      - name: Install API dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/api --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Install Web dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/web --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      - name: Run API coverage
        run: npm run test:cov --prefix apps/api

      - name: Run Web coverage
        run: npm run test:cov --prefix apps/web

      - name: Build combined coverage report
        run: npm run coverage:report

      # Gitea 1.24.7 supports the legacy artifact protocol. Its v4 backend
      # requires a patched action and is avoided until the server is upgraded.
      # The `-node20` variant is the same code on an older runtime: plain
      # v3.2.2 declares `runs.using: node24`, which act rejects outright with
      # "unknown runner using:" on older runners. Every other action in this
      # file is node20, which is why only this step would have hit it.
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error

      # if: always() so a failed suite still hands the container and its memory
      # back to a runner every other group on the machine is also using.
      - name: Stop disposable Postgres
        if: always()
        run: docker rm -f "ci-postgres-${{ github.run_id }}" || true
