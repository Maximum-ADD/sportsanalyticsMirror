name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` here on purpose: it needs the act_runner cache server to
      # be reachable, and setup-node fails the step when it isn't. Once caching
      # is confirmed working on the runner, add:
      #   cache: npm
      #   cache-dependency-path: apps/api/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The shared runner occasionally stalls a registry connection with no
      # error output; npm's default per-request timeout is 5 minutes, so two
      # stalled attempts silently burn 10+ minutes before the job dies. Bound
      # each attempt to 60s so npm fails fast and retries instead of hanging.
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      # The generated Prisma client is a typecheck dependency — src/ references
      # model fields, so tsc fails without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: |
          if ls eslint.config.* 2>/dev/null; then
            npm run lint
          else
            echo "::warning title=API lint skipped::apps/api has no eslint.config.js. ESLint 10 requires a flat config, so 'npm run lint' cannot run. Add apps/api/eslint.config.js and this step starts enforcing automatically."
          fi

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

  web:
    name: Web — lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the API job for why npm caching is left off.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # See the API job for the fetch timeout/retry tuning (stalled registry
      # connections on this runner can otherwise hang a bare `npm ci` for
      # 10+ minutes with no output before the job dies).
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Lint
        run: npm run lint

      # Solution-style tsconfig (references app + node projects), so build mode.
      - name: Typecheck
        run: npx tsc -b --noEmit

  coverage:
    name: API and Web — test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # DATABASE_URL is set by the "Start Postgres" step below, once it knows
    # which address the database ended up on. A job-level value would take
    # precedence over what that step writes to $GITHUB_ENV.
    env:
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # See the API job for the fetch timeout/retry tuning (stalled registry
      # connections on this runner can otherwise hang a bare `npm ci` for
      # 10+ minutes with no output before the job dies).
      - name: Install API dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/api --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Install Web dependencies
        timeout-minutes: 5
        run: npm ci --prefix apps/web --fetch-timeout=60000 --fetch-retries=5 --fetch-retry-mintimeout=15000 --fetch-retry-maxtimeout=60000

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      # The API e2e suite needs a real, disposable Postgres, but a `services:`
      # container gave us two failures we couldn't see into on this runner:
      # "the service 'postgres' is unhealthy" during job setup, which kills the
      # job before any step runs and prints no container logs, and a P1001
      # before that because which address reaches a service container depends
      # on how the runner networks jobs (the `postgres` bridge alias worked on
      # our own runner, localhost was needed on the shared ones).
      #
      # Starting it from a step fixes both: we get the container's logs on
      # failure, and we can bind it where nothing can collide. That matters
      # because jobs here run with `network: host` on a machine shared with
      # every other group's runner — a fixed port is what killed 5432 ("could
      # not bind IPv4 address 0.0.0.0: Address in use"), and any fixed
      # replacement collides just as easily between two concurrent jobs. So:
      # inside the job container's own network namespace when the job is
      # containerized (nothing is published on the host at all), otherwise on
      # a kernel-assigned ephemeral loopback port.
      - name: Start Postgres
        shell: bash
        working-directory: apps/api
        run: |
          set -u
          name="nba-test-pg-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          echo "PG_CONTAINER=$name" >>"$GITHUB_ENV"

          if ! docker info >/dev/null 2>&1; then
            echo "::error title=Docker unavailable::This job needs a Docker daemon to run the disposable Postgres the API e2e suite tests against."
            exit 1
          fi
          docker rm -f "$name" >/dev/null 2>&1 || true

          # --type container because a bare `docker inspect` also matches image
          # names, and a host called e.g. `postgres` would take the wrong path.
          self=$(hostname)
          if docker inspect --type container "$self" >/dev/null 2>&1; then
            docker run -d --name "$name" --network "container:$self" \
              -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=nba_analytics_test postgres:16-alpine
            host=localhost
            port=5432
          else
            docker run -d --name "$name" -p 127.0.0.1::5432 \
              -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=nba_analytics_test postgres:16-alpine
            host=127.0.0.1
            port=$(docker port "$name" 5432 | head -1 | sed 's/.*://')
          fi
          echo "Postgres container $name listening on $host:$port"

          # `prisma db execute` rather than a bare port check: it proves the
          # server is past initdb and that our credentials and database exist,
          # over the same connection the tests will use.
          url="postgresql://postgres:postgres@$host:$port/nba_analytics_test?schema=public"
          for _attempt in $(seq 1 30); do
            if echo "SELECT 1" | npx prisma db execute --url "$url" --stdin >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              echo "DATABASE_URL=$url" >>"$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done

          echo "::error title=Postgres never became ready::Nothing answered on $host:$port after 60s. Container logs follow."
          docker logs --tail 50 "$name" 2>&1 || true
          exit 1

      - name: Run API coverage
        run: npm run test:cov --prefix apps/api

      - name: Run Web coverage
        run: npm run test:cov --prefix apps/web

      - name: Build combined coverage report
        run: npm run coverage:report

      # Gitea 1.24.7 supports the legacy artifact protocol. Its v4 backend
      # requires a patched action and is avoided until the server is upgraded.
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v3.2.2
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error

      # This runner is shared, so don't leave the database container behind.
      - name: Stop Postgres
        if: always()
        shell: bash
        run: docker rm -f "${PG_CONTAINER:-}" >/dev/null 2>&1 || true
