name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` here on purpose: it needs the act_runner cache server to
      # be reachable, and setup-node fails the step when it isn't. Once caching
      # is confirmed working on the runner, add:
      #   cache: npm
      #   cache-dependency-path: apps/api/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # The generated Prisma client is a typecheck dependency — src/ references
      # model fields, so tsc fails without it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: |
          if ls eslint.config.* >/dev/null 2>&1; then
            npm run lint
          else
            echo "::warning title=API lint skipped::apps/api has no eslint.config.js. ESLint 10 requires a flat config, so 'npm run lint' cannot run. Add apps/api/eslint.config.js and this step starts enforcing automatically."
          fi

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # --passWithNoTests: the suite is empty today. Drop the flag once real
      # tests land, so an accidentally-empty run fails instead of passing.
      - name: Test
        run: npm test -- --passWithNoTests

  web:
    name: Web — lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the API job for why npm caching is left off.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Solution-style tsconfig (references app + node projects), so build mode.
      - name: Typecheck
        run: npx tsc -b --noEmit

      # No test script defined yet; --if-present keeps this green and picks the
      # suite up automatically once one is added to apps/web/package.json.
      - name: Test
        run: npm run test --if-present
