# Controls the issue-picker screen shown before a template is chosen.
#
# blank_issues_enabled stays true deliberately: forcing every issue through
# the bug form makes it harder, not easier, to jot down a task or a question,
# and an empty issue is better than no issue. Set it to false only if blank
# issues actually become a triage problem.
blank_issues_enabled: true

contact_links:
