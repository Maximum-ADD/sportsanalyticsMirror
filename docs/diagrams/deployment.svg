45,1402.3183 L719.7345,1406.3183 L754.7345,1410.3183 L754.7345,1457.2516 A0,0 0 0 0 754.7345,1457.2516 L986.5592,1457.2516 A0,0 0 0 0 986.5592,1457.2516 L986.5592,1365.3883 L976.5592,1355.3883 L754.7345,1355.3883 A0,0 0 0 0 754.7345,1355.3883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M976.5592,1355.3883 L976.5592,1365.3883 L986.5592,1365.3883 L976.5592,1355.3883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4243" x="760.7345" y="1372.9566">Auto REST/Auth/Storage APIs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8247" x="760.7345" y="1388.2672">deliberately unused -- the NestJS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.7612" x="760.7345" y="1403.5777">API stays the only HTTP path to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4541" x="760.7345" y="1418.8883">the data, per the brief.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.1377" x="760.7345" y="1434.1988">Free tier: ~500MB cap, pauses</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.0342" x="760.7345" y="1449.5094">after inactivity.</text></g><g class="entity" data-qualified-name="google.GMN27" data-source-line="72" id="ent0028"><path d="M1506.2645,1104.1883 L1506.2645,1160.1199 L1815.0165,1160.1199 L1815.0165,1114.1883 L1805.0165,1104.1883 L1506.2645,1104.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1805.0165,1104.1883 L1805.0165,1114.1883 L1815.0165,1114.1883 L1805.0165,1104.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.1548" x="1512.2645" y="1121.7566">OAuth 2.0 (Google Sign-In)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.7183" x="1512.2645" y="1137.0672">Authorized redirect:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.752" x="1512.2645" y="1152.3777">https://&lt;api-domain&gt;/auth/callback/google</text></g><g class="entity" data-qualified-name="nbaApi.GMN31" data-source-line="80" id="ent0032"><path d="M1058.7445,1355.3883 L1058.7445,1457.2516 L1280.5526,1457.2516 L1280.5526,1365.3883 L1270.5526,1355.3883 L1058.7445,1355.3883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1270.5526,1355.3883 L1270.5526,1365.3883 L1280.5526,1365.3883 L1270.5526,1355.3883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.0947" x="1064.7445" y="1372.9566">Unofficial nba_api endpoints.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.8081" x="1064.7445" y="1388.2672">Blocks cloud-provider IP ranges</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.6343" x="1064.7445" y="1403.5777">-- ingestion must run from a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.3369" x="1064.7445" y="1418.8883">residential/office network,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.2583" x="1064.7445" y="1434.1988">a factor in it not yet being</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.0913" x="1064.7445" y="1449.5094">a Render Cron Job either.</text></g><!--entity viteDev--><g class="entity" data-qualified-name="devMachine.viteDev" data-source-line="90" id="ent0035"><polygon fill="#FFFFFF" points="1381