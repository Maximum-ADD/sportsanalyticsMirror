roke:#000000;stroke-width:0.5;" x1="1625.8011" x2="1625.8011" y1="596.2483" y2="649.2248"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.1279" x="1396.4945" y="619.7834">Docker: postgres :55432</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.3066" x="1396.4945" y="636.2717">+ postgres-test :55433 (tmpfs)</text></g><!--entity ci--><g class="entity" data-qualified-name="gitea.ci" data-source-line="96" id="ent0039"><rect fill="#F1F1F1" height="55.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.5" x="710.3945" y="340.8883"/><polygon fill="#F1F1F1" points="887.8945,345.8883,887.8945,359.8883,899.8945,359.8883,899.8945,351.8883,893.8945,345.8883,887.8945,345.8883" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="893.8945" x2="893.8945" y1="345.8883" y2="351.8883"/><line style="stroke:#181818;stroke-width:0.5;" x1="899.8945" x2="893.8945" y1="351.8883" y2="351.8883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.8994" x="720.3945" y="367.4234">Gitea Actions</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.5" x="720.3945" y="383.9117">(self-hosted act_runner)</text></g><g class="entity" data-qualified-name="gitea.GMN40" data-source-line="98" id="ent0041"><path d="M939.5745,310.2883 L939.5745,364.8783 L905.3445,368.8783 L939.5745,372.8783 L939.5745,427.4621 A0,0 0 0 0 939.5745,427.4621 L1163.7122,427.4621 A0,0 0 0 0 1163.7122,427.4621 L1163.7122,320.2883 L1153.7122,310.2883 L939.5745,310.2883 A0,0 0 0 0 939.5745,310.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1153.7122,310.2883 L1153.7122,320.2883 L1163.7122,320.2883 L1153.7122,310.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.604" x="945.5745" y="327.8566">Lints/typechecks both apps,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1909" x="945.5745" y="343.1672">runs both test suites against</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8711" x="945.5745" y="358.4777">postgres-test service.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.1377" x="945.5745" y="373.7883">No deploy stage wired up yet --</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.5601" x="945.5745" y="389.0988">Render/Cloudflare currently</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.6636" x="945.5745" y="404.4094">deploy via a Gitea -&gt; GitHub</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.6636" x="945.5745" y="419.7199">mirror, not directly from Gitea.</text></g><!--entity user--><g class="entity" data-qualified-name="user" data-source-line="18" id="ent0002"><ellipse cx="373.6401" cy="339.1283" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M373.6401,347.1283 L373.6401,374.1283 M360.6401,355.1283 L386.6401,355.1283 M373.6401,374.1283 L360.6401,389.1283 M373.6401,374.1283 L386.6401,389.1283" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.8711" x="344.2045" y="404.1634">End user</text></g><g class="entity" data-qualified-name="N1" data-source-line="130" id="ent0056"><path d="M1816.3245,43.4883 L1816.3245,191.2832 L2218.9646,191.2832 L2218.9646,53.4883 L2208.9646,43.4883 L1816.3245,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2208.9646,43.4883 L2208.9646,53.4883 L2218.9646,53.4883 L2208.9646,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.6401" x="1822.3245" y="61.0566">Hosting per docs/decisions/ADR-003-hosting-topology.md</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.8633" x="1822.3245" y="76.3672">(status: Accepted, implemented 2026-08-19). Live:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.8198" x="1822.3245" y="91.6777">sportsanalytics.pages.dev (frontend) and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.3481" x="1822.3245" y="106.9883">sportsanalytics-api.onrender.com/health (API), both</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.1445" x="1822.3245" y="122.2988">returning 200 OK. Python batch jobs are the one piece</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.8594" x="1822.3245" y="137.6094">of this ADR not yet realized -- render.yaml only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.3247" x="1822.3245" y="152.9199">declares the API web service, so ingestion/predictor/</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.6699" x="1822.3245" y="168.2305">optimizer still run manually against the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.9819" x="1822.3245" y="183.541">Supabase database prod uses.</text></g><!--link renderBatch to GMN18--><g class="link" data-entity-1="ent0014" data-entity-2="ent0019" data-link-type="association" data-source-line="50" id="lnk20"><path d="M1248.6445,930.7483 C1248.6445,935.1783 1248.6445,1040.0683 1248.64