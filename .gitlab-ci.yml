stages:
  - test
  - report

default:
  image: node:20

test-api:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: nba_analytics_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/nba_analytics_test?schema=public"
    BETTER_AUTH_SECRET: "ci-secret-not-for-production-use"
    BETTER_AUTH_URL: "http://localhost:4000"
  cache:
    key:
      files:
        - apps/api/package-lock.json
    paths:
      - apps/api/node_modules
  script:
    - cd apps/api
    - npm ci
    - npm run test:cov
  # Picked up by GitLab's "Test coverage" badge/widget from vitest's text
  # coverage table (e.g. "All files | 82.14 | ..."), which the text reporter
  # in vitest.config.ts prints to the job log alongside the other reporters.
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/api/coverage
      - apps/api/test-report.json
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml

test-web:
  stage: test
  cache:
    key:
      files:
        - apps/web/package-lock.json
    paths:
      - apps/web/node_modules
  script:
    - cd apps/web
    - npm ci
    - npm run test:cov
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/web/coverage
      - apps/web/test-report.json
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/web/coverage/cobertura-coverage.xml

# Merges both apps' coverage-summary.json/test-report.json into one HTML
# dashboard (scripts/build-coverage-report.mjs). Published to GitLab Pages
# on the default branch by the `pages` job below, and always kept as a job
# artifact so it's downloadable from any pipeline.
coverage-report:
  stage: report
  needs:
    - test-api
    - test-web
  script:
    - node scripts/build-coverage-report.mjs
  artifacts:
    expire_in: 1 month
    paths:
      - coverage-report

# GitLab Pages requires a job literally named `pages` whose artifact is a
# `public/` directory. Runs only on the default branch — MR/feature-branch
# pipelines still get the same report as a downloadable job artifact above,
# they just don't overwrite the published site.
pages:
  stage: report
  needs:
    - coverage-report
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - rm -rf public
    - mkdir -p public
    - cp -r coverage-report/* public/
  artifacts:
    paths:
      - public

# Posts/updates a coverage summary comment on the merge request. Uses the
# job token by default; if this GitLab instance doesn't allow the job token
# to create notes, set a project CI/CD variable MR_COMMENT_TOKEN (an access
# token with `api` scope) and the script will use that instead. Never fails
# the pipeline — see scripts/post-mr-coverage-comment.mjs.
mr-coverage-comment:
  stage: report
  needs:
    - test-api
    - test-web
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  script:
    - node scripts/post-mr-coverage-comment.mjs
